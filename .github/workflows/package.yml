name: Package installation
on:
  push:
    paths:
      - .github/workflows/package.yml
      - .gitattributes
      - package.json
      - package-lock.json
      - cordis.patch.yml
      - src/**
      - adapters/**
      - vendor/**
      - scripts/build.mjs
      - scripts/verify-core.mjs
      - scripts/verify-panel.mjs
      - scripts/probe-package.mjs
  pull_request:
    paths:
      - .github/workflows/package.yml
      - .gitattributes
      - package.json
      - package-lock.json
      - cordis.patch.yml
      - src/**
      - adapters/**
      - vendor/**
      - scripts/build.mjs
      - scripts/verify-core.mjs
      - scripts/verify-panel.mjs
      - scripts/probe-package.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:package
